<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>號碼預測中心</title>

<style>

body{
    margin:0;
    padding:20px;
    background:#f5f7fa;
    font-family:"Microsoft JhengHei",sans-serif;
}

.container{
    max-width:1000px;
    margin:auto;
}

h1{
    text-align:center;
}

.menu-btn{
    display:inline-block;
    background:#2563eb;
    color:white;
    text-decoration:none;
    padding:12px 24px;
    border-radius:10px;
}

.card{
    background:white;
    padding:20px;
    border-radius:15px;
    margin-top:20px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.select-box{
    margin:15px 0;
}

select{
    padding:8px;
    font-size:18px;
}

.predict-btn{
    width:100%;
    background:#256bd6;
    color:white;
    border:none;
    height:52px;
    font-size:18px;
    border-radius:0;
    cursor:pointer;
    transition:0.2s;
}

.predict-btn:hover{
    background:#1e4faa;
}

.prediction-result{
    text-align:center;
    font-size:36px;
    font-weight:bold;
    color:red;
    margin-top:20px;
    padding:20px;
}

</style>

</head>
<body>

<div class="container">

<h1>🎯 號碼預測中心</h1>

<p>
<a href="index.html" class="menu-btn">
🏠 返回首頁
</a>
</p>

<div class="card">

<h2>分區均值演算法</h2>

<div class="select-box">

遊戲：

<select id="game">

<option value="539">
今彩539
</option>

<option value="power">
威力彩
</option>

<option value="lotto649">
大樂透
</option>

</select>

</div>

<div class="select-box">

分析期數：

<select id="period">

<option value="10">10期</option>
<option value="30">30期</option>
<option value="50">50期</option>
<option value="100">100期</option>
<option value="200">200期</option>

</select>

</div>

<div class="select-box">

<button id="predictBtn" class="predict-btn">
🎯 開始預測
</button>

</div>

<h3>預測號碼：</h3>

<div id="prediction" class="prediction-result">
尚未載入
</div>

</div>

</div>
<script>

let predictionData = {};

fetch('prediction.json?t='+Date.now())
.then(r => r.json())
.then(data => {

    predictionData = data;

});

document.getElementById('predictBtn')
.addEventListener('click', function(){

    const game =
        document.getElementById('game').value;

    const period =
        document.getElementById('period').value;

    const result =
        predictionData[game][period];

    let display = '';

    if(game === 'power'){

        display =
            result.first
            .map(n => String(n).padStart(2,'0'))
            .join(' ')
            +
            ' 第二區：'
            +
            String(result.second).padStart(2,'0');

    }else{

        display =
            result
            .map(n => String(n).padStart(2,'0'))
            .join(' ');
    }

    document.getElementById('prediction')
        .innerText = display;

});

</script>
</body>
</html>
