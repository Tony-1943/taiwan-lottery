<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>號碼預測中心</title>

<style>

body{
    margin:0;
    padding:20px;
    background:#f5f7fa;
    font-family:"Microsoft JhengHei",sans-serif;
}

.container{
    max-width:1000px;
    margin:auto;
}

h1{
    text-align:center;
}

.menu-btn{
    display:inline-block;
    background:#2563eb;
    color:white;
    text-decoration:none;
    padding:12px 24px;
    border-radius:10px;
}

.card{
    background:white;
    padding:20px;
    border-radius:15px;
    margin-top:20px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.select-box{
    margin:15px 0;
}

select{
    padding:8px;
    font-size:18px;
}

.predict-btn{
    width:100%;
    background:#256bd6;
    color:white;
    border:none;
    height:52px;
    font-size:18px;
    border-radius:0;
    cursor:pointer;
    transition:0.2s;
}

.predict-btn:hover{
    background:#1e4faa;
}

.prediction-result{
    text-align:center;   
    margin-top:20px;
    padding:20px;
}

#heatmap{
    margin-top:20px;
}

.heat-row{
    margin:12px 0;
    font-size:16px;
}

.heat-label{
    display:inline-block;
    width:70px;
    font-weight:bold;
}

.heat-bar{
    display:inline-block;
    height:22px;
    background:#2563eb;
    border-radius:6px;
    vertical-align:middle;
}

.ball-container{
    text-align:center;
}

.ball{
    width:60px;
    height:60px;
    border-radius:50%;
    background:#dc2626;
    color:white;
    display:inline-flex;
    justify-content:center;
    align-items:center;
    font-size:24px;
    font-weight:bold;
    margin:5px;
    box-shadow:0 3px 8px rgba(0,0,0,.2);
}

.second-ball{
    background:#facc15;
    color:black;
}
@media (max-width:768px){

    .heat-label{
        width:55px;
        font-size:14px;
    }

    .heat-row{
        font-size:14px;
    }

    .heat-bar{
        max-width:180px;
    }

    .ball{
        width:36px;
        height:36px;
        font-size:14px;
    }
}
.active{
background:#6b7280;
cursor:default;
}
</style>

</head>
<body>

<div class="container">

<h1>🎯 號碼預測中心</h1>

<p>
<div class=
<a class="menu-btn active">🎯 號碼預測</a>   
<a href="index.html" class="menu-btn">🏠 首頁</a>
<a href="scratch.html"class="menu-btn">🎫 刮刮樂</a>
</a>
</p>

<div class="card">

<h2>分區均值演算法</h2>

<div class="select-box">

遊戲：

<select id="game">

<option value="539">
今彩539
</option>

<option value="power">
威力彩
</option>

<option value="lotto649">
大樂透
</option>

</select>

</div>

<div class="select-box">

分析期數：

<select id="period">

<option value="10">10期</option>
<option value="30">30期</option>
<option value="50">50期</option>
<option value="100">100期</option>
<option value="200">200期</option>

</select>

</div>

<div class="select-box">

<button id="predictBtn" class="predict-btn">
🎯 開始預測
</button>

</div>

<h3>預測號碼：</h3>

<div id="prediction" class="prediction-result">
尚未載入
</div>
<h3>🔥 區間熱度圖</h3>
<div id="heatmap"></div>
</div>

</div>
<script>

let predictionData = {};

fetch('prediction.json?t=' + Date.now())
.then(r => r.json())
.then(data => {

    predictionData = data;

});

document.getElementById('predictBtn')
.addEventListener('click', function(){

    const game =
        document.getElementById('game').value;

    const period =
        document.getElementById('period').value;

    const data =
        predictionData[game][period];

    let result;
    let heat;

    if(game === 'power'){

        result = data.prediction;
        heat = data.heat.zones;

    }else{

        result = data.numbers;
        heat = data.heat;
    }

    /* 彩球 */

    let ballHtml = '';

    if(game === 'power'){

        result.first.forEach(n=>{

            ballHtml += `
            <div class="ball">
                ${String(n).padStart(2,'0')}
            </div>`;
        });

        ballHtml += `
        <div style="width:100%;margin-top:15px;font-size:20px;font-weight:bold;">
            第二區
        </div>

        <div class="ball second-ball">
            ${String(result.second).padStart(2,'0')}
        </div>`;

    }else{

        result.forEach(n=>{

            ballHtml += `
            <div class="ball">
                ${String(n).padStart(2,'0')}
            </div>`;
        });
    }

    document.getElementById('prediction').innerHTML =
        `<div class="ball-container">${ballHtml}</div>`;


    /* 真實熱度圖 */

    let heatHtml = '';

    if(game === '539'){

        const labels = [
            '01-08',
            '09-16',
            '17-24',
            '25-32',
            '33-39'
        ];
        const maxHeat = Math.max(...heat);
        heat.forEach((count,index)=>{

            heatHtml += `
            <div class="heat-row">
                <span class="heat-label">${labels[index]}</span>

                <span class="heat-bar"
                style="
                    width:${(count / maxHeat) * 200}px;
                    background:linear-gradient(
                        90deg,
                        #22c55e,
                        #eab308,
                        #ef4444
                    );
                ">
                </span>

                ${count}次
            </div>`;
        });
    }

    else if(game === 'lotto649'){

        const labels = [
            '01-08',
            '09-16',
            '17-24',
            '25-32',
            '33-40',
            '41-49'
        ];
        const maxHeat = Math.max(...heat);
        heat.forEach((count,index)=>{

            heatHtml += `
            <div class="heat-row">
                <span class="heat-label">${labels[index]}</span>

                <span class="heat-bar"
                style="
                    width:${(count / maxHeat) * 200}px;
                    background:linear-gradient(
                        90deg,
                        #22c55e,
                        #eab308,
                        #ef4444
                    );
                ">
                </span>

                ${count}次
            </div>`;
        });
    }

    else if(game === 'power'){

        const labels = [
            '01-06',
            '07-12',
            '13-18',
            '19-24',
            '25-30',
            '31-38'
        ];
        const maxHeat = Math.max(...heat);
        heat.forEach((count,index)=>{

            heatHtml += `
            <div class="heat-row">
                <span class="heat-label">${labels[index]}</span>

                <span class="heat-bar"
                style="
                    width:${(count / maxHeat) * 200}px;
                    background:linear-gradient(
                        90deg,
                        #22c55e,
                        #eab308,
                        #ef4444
                    );
                ">
                </span>

                ${count}次
            </div>`;
        });
        const secondHeat = data.heat.second;

        const maxSecond =
            Math.max(...secondHeat);

        heatHtml += `
        <h4>🟡 第二區熱度</h4>
        `;

        secondHeat.forEach((count,index)=>{

            heatHtml += `
            <div class="heat-row">

                <span class="heat-label">
                    ${String(index+1).padStart(2,'0')}
                </span>

                <span class="heat-bar"
                style="
                    width:${(count/maxSecond)*300}px;
                    background:#facc15;
                ">
                </span>

                ${count}次

            </div>`;
        });
    }
        
    document.getElementById('heatmap').innerHTML =
        heatHtml;

});

</script>
</body>
</html>
