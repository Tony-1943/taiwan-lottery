name: Lottery Auto Update and Deploy Pages

on:
  schedule:
    # 每天台灣時間凌晨 1:51
    - cron: "51 1 * * *"
      timezone: "Asia/Taipei"

  workflow_dispatch:

  # 使用 GitHub Desktop 推送時也會部署
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 1. 下載 main 分支
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # 2. 安裝 Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. 安裝套件
      - name: Install Packages
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests openpyxl python-docx TaiwanLottery

      # 4. 執行彩券更新程式
      - name: Run Lottery Program
        run: |
          python 539.py

      # 5. 檢查程式是否真的更新檔案
      - name: Check Updated Files
        run: |
          echo "===== Git 狀態 ====="
          git status

          echo "===== 修改過的檔案 ====="
          git diff --name-only

          echo "===== JSON 檔案時間 ====="
          find . -maxdepth 2 -name "*.json" -type f -exec ls -lh {} \;

      # 6. 提交更新
      - name: Commit Updated Files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add .

          if git diff --cached --quiet; then
            echo "沒有新資料，跳過提交"
          else
            git commit -m "Auto Update Lottery Data"
            git pull --rebase origin main
            git push origin main
          fi

      # 7. 確認目前工作目錄是最新版本
      - name: Refresh Latest Main
        run: |
          git fetch origin main
          git reset --hard origin/main

          echo "===== 即將部署的版本 ====="
          git log -1 --oneline

      # 8. 設定 Pages
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # 9. 上傳網站
      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      # 10. 部署 Pages
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
