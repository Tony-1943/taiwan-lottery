name: Lottery Auto Update and Deploy Pages

on:
  schedule:
    # 每天台灣時間凌晨 1:51
    - cron: "51 1 * * *"
      timezone: "Asia/Taipei"

  workflow_dispatch:

  # GitHub Desktop 推送時也執行
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 1. 下載專案
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # 2. 安裝 Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. 安裝套件
      - name: Install Packages
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests openpyxl python-docx TaiwanLottery

      # 4. 只有排程或手動執行時才執行 Python
      # GitHub Desktop 推送時不重跑 Python
      - name: Run Lottery Program
        if: github.event_name != 'push'
        run: |
          python 539.py

      # 5. 顯示真正修改的檔案
      - name: Check Updated Files
        run: |
          echo "===== Git 狀態 ====="
          git status --short

          echo "===== JSON 檔案 ====="
          find . -maxdepth 2 -name "*.json" -type f -exec ls -lh {} \;

      # 6. 提交 Python 更新的資料
      - name: Commit Updated Files
        if: github.event_name != 'push'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add .

          if git diff --cached --quiet; then
            echo "沒有新資料，不需要提交"
          else
            git commit -m "Auto Update Lottery Data"
            git push origin main
          fi

      # 注意：這裡不要再使用 git reset --hard
      # 因為 reset 可能把 Python 剛產生的檔案恢復掉

      # 7. 設定 Pages
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # 8. 直接上傳目前工作目錄
      # 此時裡面已經是 Python 更新後的資料
      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      # 9. 發布 Pages
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
