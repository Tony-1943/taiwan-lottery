name: Lottery Auto Update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Packages
        run: |
          pip install pandas requests openpyxl python-docx
          pip install pandas
          pip install openpyxl
          pip install python-docx
          pip install TaiwanLottery

      - name: Run Program
        run: |
          python 539_穩定版.py

      
