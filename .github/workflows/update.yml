name: Lottery Auto Update and Deploy Pages

on:
  schedule:
    # 每天台灣時間凌晨 1:51
    - cron: "51 1 * * *"
      timezone: "Asia/Taipei"

  # 允許在 Actions 頁面手動執行
  workflow_dispatch:

  # GitHub Desktop 推送到 main 時也部署
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 1. 下載 main 分支
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # 2. 安裝 Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. 安裝套件
      # GitHub Desktop 推送時不需要安裝 Python 套件
      - name: Install Packages
        if: github.event_name != 'push'
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests openpyxl python-docx TaiwanLottery

      # 4. 排程或手動執行時才執行 Python
      - name: Run Lottery Program
        if: github.event_name != 'push'
        run: |
          python 539.py

      # 5. 檢查 Python 修改了哪些檔案
      - name: Check Updated Files
        if: github.event_name != 'push'
        run: |
          echo "===== Git 狀態 ====="
          git status --short

          echo "===== 修改過的檔案 ====="
          git diff --name-only

          echo "===== JSON 檔案 ====="
          find . -maxdepth 2 -name "*.json" -type f -exec ls -lh {} \;

      # 6. 將 Python 更新的檔案提交到 main
      - name: Commit Updated Files
        if: github.event_name != 'push'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add .

          if git diff --cached --quiet; then
            echo "沒有新資料，不需要提交"
          else
            git commit -m "Auto Update Lottery Data"
            git push origin main
          fi

      # 7. 排程或手動執行時，等待 10 分鐘
      # GitHub Desktop 推送時不等待
      - name: Wait 10 Minutes Before Deployment
        if: github.event_name != 'push'
        run: |
          echo "檔案更新完成，等待 10 分鐘後發布 GitHub Pages"
          sleep 600

      # 8. 設定 GitHub Pages
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # 9. 上傳目前工作目錄
      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      # 10. 發布 GitHub Pages
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
