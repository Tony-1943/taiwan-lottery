<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>台灣彩券分析系統</title>

<style>

body{
    margin:0;
    padding:20px;
    background:#f5f7fa;
    font-family:"Microsoft JhengHei",sans-serif;
}

h1{
    text-align:center;
    color:#1f2937;
}

.container{
    max-width:1200px;
    margin:auto;
}

.grid{

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(350px,1fr));

    gap:20px;
}

.card{

    background:white;

    border-radius:15px;

    padding:20px;

    box-shadow:
    0 2px 8px rgba(0,0,0,0.1);
}

.card h2{

    margin-top:0;

    color:#374151;
}

.number{

    font-size:40px;

    font-weight:bold;

    color:red;

    margin:15px 0;
}

.small-number{

    font-size:30px;

    font-weight:bold;

    color:#2563eb;
}

.download{

    margin-top:20px;
}

.btn{

    display:inline-block;

    padding:12px 20px;

    margin:5px;

    background:#2563eb;

    color:white;

    text-decoration:none;

    border-radius:8px;
}

.btn:hover{

    background:#1d4ed8;
}

.analysis{

    line-height:2;
    font-size:18px;
}

.footer{

    text-align:center;

    margin-top:30px;

    color:#6b7280;
}

</style>

</head>

<body>

<div class="container">

<h1>🎰 台灣彩券分析系統</h1>


<div class="grid">

    <div class="card">

        <h2>今彩539</h2>

        <div class="number">

            12 14 19 25 26

        </div>

        <p>最新一期</p>

    </div>


    <div class="card">

        <h2>3星彩</h2>

        <div class="small-number">

            5 0 2

        </div>

    </div>


    <div class="card">

        <h2>威力彩</h2>

        <div class="number">

            08 10 13 21 29 31

        </div>

        <p>第二區：07</p>

    </div>


    <div class="card">

        <h2>4星彩</h2>

        <div class="small-number">

            7 9 4 7

        </div>

    </div>


    <div class="card">

        <h2>大樂透</h2>

        <div class="number">

            02 08 15 26 35 46

        </div>

        <p>特別號：11</p>

    </div>


    <div class="card">

        <h2>熱門號碼 TOP5</h2>

        <div class="analysis">

            12<br>
            19<br>
            25<br>
            35<br>
            14

        </div>

    </div>


    <div class="card">

        <h2>遺漏值排行</h2>

        <div class="analysis">

            08 （23期）<br>
            17 （19期）<br>
            04 （18期）<br>
            32 （17期）<br>
            39 （15期）

        </div>

    </div>


    <div class="card">

        <h2>報表下載</h2>

        <div class="download">

            <a href="sx

               📊 Excel報表

            </a>

            紀錄.docx"
               class="btn">

               📄 Word報表

            </a>

        </div>

    </div>

</div>

<div class="footer">

最後更新：
2026-07-29

</div>

</div>

</body>

</html>
