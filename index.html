<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台灣彩券分析系統</title>
<style>
body{margin:0;padding:20px;background:#f5f7fa;font-family:"Microsoft JhengHei",sans-serif;}
.container{max-width:1200px;margin:auto;}
h1{text-align:center;color:#1f2937;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(350px,1fr));gap:20px;}
.card{background:white;border-radius:15px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,0.1);}
.card h2{margin-top:0;color:#374151;}
.number{font-size:28px;font-weight:bold;color:red;margin:10px 0;}
.star{font-size:24px;font-weight:bold;color:#2563eb;}
.info{color:#666;margin-top:5px;}
.btn{display:inline-block;background:#2563eb;color:#fff;padding:12px 20px;text-decoration:none;border-radius:10px;margin:5px 0;}
.btn:hover{background:#1d4ed8;}
.footer{text-align:center;margin-top:30px;color:#888;}
.top-menu{
    text-align:center;
    margin:20px 0 30px 0;
}

.menu-btn{
    display:inline-block;
    background:#2563eb;
    color:white;
    text-decoration:none;
    padding:12px 24px;
    border-radius:10px;
    font-size:18px;
    font-weight:bold;
}

.menu-btn:hover{
    background:#1d4ed8;
}
.ball-group{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:8px;
    margin-top:10px;
}

.ball{
    width:42px;
    height:42px;
    border-radius:50%;
    background:#dc2626;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:bold;
    font-size:16px;
    box-shadow:0 2px 6px rgba(0,0,0,.2);
}

.special-ball{
    background:#facc15;
    color:black;
}
</style>
</head>
<body>
<div class="container">
<h1>🎰 台灣彩券分析系統</h1>

<div class=
    <a href="index.html" class="menu-btn">🏠 首頁</a>
    <a href="prediction.html" class="menu-btn">🎯 號碼預測</a>
    <a href="scratch.html"class="menu-btn">🎫 刮刮樂專區</a>
</div>

<div class="grid">
<div class="card"><h2>今彩539</h2><div id="539_numbers" class="number">載入中...</div><div id="539_info" class="info"></div></div>
<div class="card"><h2>大樂透</h2><div id="lotto_numbers" class="number">載入中...</div><div id="lotto_special" class="info"></div></div>
<div class="card"><h2>威力彩</h2><div id="power_numbers" class="number">載入中...</div><div id="power_special" class="info"></div></div>
<div class="card"><h2>4星彩</h2><div id="4star_numbers" class="star">載入中...</div><div id="4star_info" class="info"></div></div>
<div class="card"><h2>3星彩</h2><div id="3star_numbers" class="star">載入中...</div><div id="3star_info" class="info"></div></div>
<div class="card"><h2>系統資訊</h2><div id="update_time">資料載入中...</div></div>
<div class="card">
<h2>報表下載</h2>
<p><a href="最新開獎紀錄.xlsx" class="btn" target="_blank" download>📊 Excel報表</a></p>
<p><a href="最新開獎紀錄.docx" class="btn" target="_blank" download>📄 Word報表</a></p>
</div>
</div>
<div class="footer">Tony-1943 台灣彩券分析系統</div>
</div>
<script>

fetch('data.json?t='+Date.now())
.then(r=>r.json())
.then(data=>{let html539 = '';data['539']['numbers'].split(/\s+/).forEach(n=>{html539 += `<div class="ball">${n}</div>`;});
document.getElementById('539_numbers').innerHTML =
`<div class="ball-group">${html539}</div>`;
 document.getElementById('539_info').innerText='期別：'+data['539']['period']+' 日期：'+data['539']['date'];
 let htmlPower='';data['power']['numbers'].split(/\s+/).forEach(n=>{htmlPower+=`<div class="ball">${n}</div>`;});htmlPower+=`<div class="ball special-ball">${data['power']['special']}</div>`;document.getElementById('power_numbers').innerHTML=`<div class="ball-group">${htmlPower}</div>`;
 document.getElementById('power_special').innerText='期別：' + data['power']['period'] +' 日期：' + data['power']['date'];
 let html649='';data['lotto649']['numbers'].split(/\s+/).forEach(n=>{html649+=`<div class="ball">${n}</div>`;});html649+=`<div class="ball special-ball">${data['lotto649']['special']}</div>`;document.getElementById('lotto_numbers').innerHTML=`<div class="ball-group">${html649}</div>`;
 document.getElementById('lotto_special').innerText='期別：' + data['lotto649']['period'] +' 日期：' + data['lotto649']['date'];
 let html3='';data['3star']['numbers'].split(/\s+/).forEach(n=>{html3+=`<div class="ball">${n}</div>`;});document.getElementById('3star_numbers').innerHTML=`<div class="ball-group">${html3}</div>`;
 document.getElementById('3star_info').innerText=data['3star']['date'];
 let html4='';data['4star']['numbers'].split(/\s+/).forEach(n=>{html4+=`<div class="ball">${n}</div>`;});document.getElementById('4star_numbers').innerHTML=`<div class="ball-group">${html4}</div>`;
 document.getElementById('4star_info').innerText=data['4star']['date'];
 document.getElementById('update_time').innerText='最後更新：'+data['update_time'];
})
.catch(()=>{document.getElementById('update_time').innerText='讀取 data.json 失敗';});
</script>
</body>
</html>
